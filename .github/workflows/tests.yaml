name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test Python API and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app.py tests
      - name: Check Python formatting
        run: ruff format --check app.py tests
      - name: Scan Python for common security issues
        run: bandit --recursive app.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js